# Railway Configuration for HRMS Backend
# This tells Railway to build the backend from hrms_backend folder

[build]
builder = "DOCKERFILE"
dockerfilePath = "hrms_backend/Dockerfile"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 4"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
